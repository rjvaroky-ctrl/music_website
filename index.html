    function showSongs(category) {
      lastCategory = category;
      const container = document.getElementById('videoContainer');
      container.innerHTML = '';
      videoData[category].forEach(video => {
        // Create a grid column that spans 4 columns on medium and larger devices, and full width on small devices.
        const songItem = document.createElement('div');
        songItem.className = 'col-md-4 col-12 mb-3';
        songItem.innerHTML = `
        <div class="position-relative">
                <!-- Image as background -->
                <img src="${video.img || 'default.jpg'}" alt="${video.title}" 
                    class="img-fluid w-100" style="height: 200px; object-fit: cover; border-radius: 8px;">

                <!-- Button overlay -->
                <button class="btn btn-outline-light position-absolute start-50 translate-middle-x" 
                    style="bottom: 10px; width: 80%; height: 40px; background: rgba(0, 0, 0, 0.5); color: white; border: none; font-weight: bold;" 
                    onclick="showVideo('${video.src}', '${video.title}')">
                    ${video.title}
                </button>
            </div>
        `;
        container.appendChild(songItem);
      });
    }

    function showVideo(src, title) {
      const container = document.getElementById('videoContainer');  
      container.innerHTML = `
        <div class="col-12 text-center">
          <h3>${title}</h3>
          <video controls class="w-100">
            <source src="${src}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <button class="btn btn-primary mt-3" onclick="goBackToSongs()">Back to Song List</button>
        </div>
      `;
    }

    function goBackToSongs() {
      if (lastCategory) {
        showSongs(lastCategory);
      } else {
        showAllCategories();
      }
    }

    function showAllCategories() {
      document.getElementById('videoContainer').innerHTML = `
        <div class="alert alert-info text-center">Select a category from the navigation bar to see songs.</div>
      `;
      lastCategory = null;
    }
